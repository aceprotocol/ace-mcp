# ACE MCP — CI/CD
#
# Every action is pinned to a full commit SHA with its release tag in a comment; let
# Dependabot (package-ecosystem: github-actions) or Renovate keep the pins current —
# bump SHA and comment together.
#
# Pushes to `test` deploy to the GitHub environment `test`, pushes to `main` to `prod`.
# The deploy job's OIDC subject is therefore `repo:<org>/<repo>:environment:test` or
# `...:environment:prod`: the trust policy of the AWS_ROLE_ARN role must match those.
# Every deployment-specific value comes from that environment (give `prod` required
# reviewers and restrict both to their branch):
#   variables: AWS_REGION, ECR_REPOSITORY, MCP_HOST, PUBLIC_RELAY_URL, RELAY_URL, APP_PORT,
#              METRICS_PORT, REDIS_DB, DOCKER_NETWORK, VALKEY_CONTAINER, MCP_CONTAINER_IP
#              (the container's static address on DOCKER_NETWORK: the relay trusts
#              X-Forwarded-For only from it; DOCKER_NETWORK must be created with a
#              user-configured subnet containing it, e.g. `docker network create
#              --subnet 172.30.0.0/16 <name>`, or the deploy fails before touching the
#              running container)
#   secrets:   AWS_ROLE_ARN, ECR_REGISTRY, DEPLOY_INSTANCE_ID, KEK_SSM_PARAM,
#              VALKEY_PASSWORD_SSM_PARAM
# Use one KEK per environment, and never rotate one without re-encrypting every identity
# stored under it.
#
# Until @ace-protocol/sdk is published, the jobs check out sdk-ts next to this repo so
# `file:../sdk-ts` resolves, and the image build vendors the SDK as a tarball
# (scripts/vendor-local-deps.sh). Tests use an in-memory relay (tests/helpers/fake-relay.ts).

name: ACE MCP

on:
  push:
    branches: [test, main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'resources/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.tests.json'
      - 'vitest.config.ts'
      - 'eslint.config.mjs'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      flush_once:
        # Only for a release that changes the stored state format: every hosted identity of this environment is
        # deleted. Never leave it on.
        description: 'One-time FLUSHDB of the environment MCP database (REDIS_DB) after the old container stops; deletes every hosted identity'
        type: boolean
        default: false

# Least privilege: only the deploy job (ECR push, SSM deploy) gets an OIDC token; the
# others run with read-only contents.
permissions:
  contents: read

env:
  # Full reviewed source pins are versioned with this service. Verification and
  # packaging consume the same combination; no external mutable repository variables.
  ACE_SPEC_REPO: aceprotocol/ace-spec
  ACE_SPEC_SHA: d434e3e9812a9fd045c08e9d84de76f8a9487285
  SDK_TS_REPO: aceprotocol/ace-sdk-ts
  SDK_TS_SHA: 98a74c8c5c072a1ac363bc3a913108699453d5c0

jobs:
  sources:
    runs-on: ubuntu-latest
    outputs:
      ace_spec_sha: ${{ steps.pins.outputs.ace_spec_sha }}
      sdk_ts_sha: ${{ steps.pins.outputs.sdk_ts_sha }}
    steps:
      - id: pins
        name: Freeze reviewed source revisions for this run
        run: |
          for v in ACE_SPEC_SHA SDK_TS_SHA; do
            [[ "${!v}" =~ ^[a-f0-9]{40}$ ]] || { echo "$v must be a full commit SHA" >&2; exit 1; }
            echo "${v,,}=${!v}" >> "$GITHUB_OUTPUT"
          done

  # Gate the image build on the test suite. The suites talk to a real Redis at
  # redis://localhost:16379/<db> and the stack helper asserts at least 64 databases, so
  # Valkey runs with --databases 64 — a service container cannot take a command, hence
  # `docker run`. No password: the throwaway CI instance has none.
  verify:
    needs: sources
    env:
      ACE_SPEC_SHA: ${{ needs.sources.outputs.ace_spec_sha }}
      SDK_TS_SHA: ${{ needs.sources.outputs.sdk_ts_sha }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: ace-mcp
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ env.SDK_TS_REPO }}
          ref: ${{ env.SDK_TS_SHA }}
          path: sdk-ts
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ env.ACE_SPEC_REPO }}
          ref: ${{ env.ACE_SPEC_SHA }}
          path: ace-spec
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            ace-mcp/package-lock.json
            sdk-ts/package-lock.json

      - name: Start Valkey (64 dbs)
        run: |
          docker run -d --name ci-valkey -p 16379:6379 valkey/valkey:8 valkey-server --save '' --databases 64
          for i in $(seq 1 20); do docker exec ci-valkey valkey-cli ping 2>/dev/null | grep -q PONG && exit 0; sleep 1; done
          echo "Valkey did not start"; exit 1

      - name: Build sdk-ts
        working-directory: sdk-ts
        run: npm ci && npm run build
      - name: Verify the SDK against the pinned spec profiles
        working-directory: sdk-ts
        run: npm run lint && npm test

      - working-directory: ace-mcp
        run: npm ci
      - working-directory: ace-mcp
        run: npm audit --omit=dev --audit-level=high
      # lint includes typecheck:tests, which type-checks src as well
      - working-directory: ace-mcp
        run: npm run lint
      - working-directory: ace-mcp
        run: npm test
      - working-directory: ace-mcp
        run: npm run build

  # Build, push and deploy in one job of the branch's environment, so the environment's
  # secrets and protection rules cover the image push as well as the deploy.
  deploy:
    needs: [sources, verify]
    if: github.ref_name == 'test' || github.ref_name == 'main'
    environment: ${{ github.ref_name == 'main' && 'prod' || 'test' }}
    env:
      SDK_TS_SHA: ${{ needs.sources.outputs.sdk_ts_sha }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: ace-mcp
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ env.SDK_TS_REPO }}
          ref: ${{ env.SDK_TS_SHA }}
          path: sdk-ts
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdk-ts/package-lock.json

      # file:../sdk-ts cannot resolve inside the Docker build context: pack the SDK into
      # ace-mcp/vendor/*.tgz, point the dependency at it, pin the SDK's transitive deps to
      # sdk-ts's locked versions with exact `overrides`, refresh the lockfile and assert
      # those entries match sdk-ts's lock (version + integrity); then audit the rewritten lock.
      - name: Vendor local dependencies
        run: |
          (cd sdk-ts && npm ci && npm run build)
          ace-mcp/scripts/vendor-local-deps.sh
          (cd ace-mcp && npm audit --omit=dev --audit-level=high)

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build & push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ace-mcp
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.ref_name }}-${{ github.sha }}
            ${{ secrets.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.ref_name }}-latest

      - name: Deploy via SSM
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_URI: ${{ secrets.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.ref_name }}-${{ github.sha }}
          INSTANCE_ID: ${{ secrets.DEPLOY_INSTANCE_ID }}
          KEK_PARAM: ${{ secrets.KEK_SSM_PARAM }}
          VALKEY_PASSWORD_PARAM: ${{ secrets.VALKEY_PASSWORD_SSM_PARAM }}
          CONTAINER: ace-mcp-${{ github.ref_name == 'main' && 'prod' || 'test' }}
          APP_PORT: ${{ vars.APP_PORT }}
          METRICS_PORT: ${{ vars.METRICS_PORT }}
          REDIS_DB: ${{ vars.REDIS_DB }}
          DOCKER_NETWORK: ${{ vars.DOCKER_NETWORK }}
          MCP_CONTAINER_IP: ${{ vars.MCP_CONTAINER_IP }}
          VALKEY_CONTAINER: ${{ vars.VALKEY_CONTAINER }}
          RELAY_URL: ${{ vars.RELAY_URL }}
          PUBLIC_RELAY_URL: ${{ vars.PUBLIC_RELAY_URL }}
          MCP_HOST: ${{ vars.MCP_HOST }}
          FLUSH_ONCE: ${{ inputs.flush_once == true && 'true' || 'false' }}
        run: |
          for v in AWS_REGION ECR_REGISTRY INSTANCE_ID KEK_PARAM VALKEY_PASSWORD_PARAM APP_PORT METRICS_PORT REDIS_DB DOCKER_NETWORK MCP_CONTAINER_IP VALKEY_CONTAINER RELAY_URL PUBLIC_RELAY_URL MCP_HOST; do
            [ -n "${!v}" ] || { echo "environment value $v is not set" >&2; exit 1; }
          done
          # Build SSM commands as JSON array (each element = one script line)
          #
          # The host's reverse proxy is the only way in: app and metrics ports bind loopback,
          # so the service trusts that hop's X-Forwarded-For. The proxy reaches the container
          # from the Docker network's gateway, so TRUST_PROXY is loopback plus exactly that
          # gateway IP — never a private range, which would let every container on the
          # network spoof X-Forwarded-For and defeat every per-IP limit.
          # The container has a static address on the network (MCP_CONTAINER_IP): the relay
          # trusts X-Forwarded-For only from it. `docker run --ip` needs a network created
          # with a user-configured subnet, so before the old container stops the script
          # checks that DOCKER_NETWORK has one and that MCP_CONTAINER_IP lies in it.
          # The container listens on its defaults (PORT 3100, METRICS_PORT 9100).
          # ALLOWED_HOSTS also guards /health, so the health check sends the Host header.
          # Secrets are read from SSM on the instance and never echoed (no set -x). Both are
          # written 0400, owned by uid 1000 (the image's `node` user), into a 0700 root
          # directory and mounted read-only as MCP_KEK_FILE and REDIS_URL_FILE, so neither is
          # in the container's environment or `docker inspect`. The Valkey password is
          # percent-encoded by python3 from its environment (not argv) and written by the
          # shell builtin printf. The service refuses a group/world-readable file.
          #
          # FLUSH_ONCE: after the old container stops and before it is removed, FLUSHDB this
          # environment's MCP database (REDIS_DB) only. If the flush fails, the old container
          # is started again and the deploy fails. The password reaches valkey-cli as
          # REDISCLI_AUTH through the environment, never argv.
          python3 -c "
          import json
          cmds = [
              '#!/bin/bash',
              'set -euo pipefail',
              'AWS_REGION=\"$AWS_REGION\"',
              'ECR_REGISTRY=\"$ECR_REGISTRY\"',
              'IMAGE_URI=\"$IMAGE_URI\"',
              'CONTAINER=\"$CONTAINER\"',
              'APP_PORT=\"$APP_PORT\"',
              'METRICS_PORT=\"$METRICS_PORT\"',
              'REDIS_DB=\"$REDIS_DB\"',
              'DOCKER_NETWORK=\"$DOCKER_NETWORK\"',
              'MCP_CONTAINER_IP=\"$MCP_CONTAINER_IP\"',
              'VALKEY_CONTAINER=\"$VALKEY_CONTAINER\"',
              'RELAY_URL=\"$RELAY_URL\"',
              'PUBLIC_RELAY_URL=\"$PUBLIC_RELAY_URL\"',
              'MCP_HOST=\"$MCP_HOST\"',
              'KEK_PARAM=\"$KEK_PARAM\"',
              'VALKEY_PASSWORD_PARAM=\"$VALKEY_PASSWORD_PARAM\"',
              'FLUSH_ONCE=\"$FLUSH_ONCE\"',
              'VALKEY_PASSWORD=\$(aws ssm get-parameter --name \"\$VALKEY_PASSWORD_PARAM\" --with-decryption --query Parameter.Value --output text --region \"\$AWS_REGION\")',
              'test -n \"\$VALKEY_PASSWORD\" || { echo \"ERROR: empty Valkey password\"; exit 1; }',
              'export VALKEY_PASSWORD',
              'VALKEY_PASSWORD_ENC=\$(python3 -c \"import os, sys, urllib.parse; sys.stdout.write(urllib.parse.quote(os.environ[sys.argv[1]], safe=str()))\" VALKEY_PASSWORD)',
              'test -n \"\$VALKEY_PASSWORD_ENC\" || { echo \"ERROR: could not encode the Valkey password\"; exit 1; }',
              'KEK_DIR=/etc/ace-mcp',
              'KEK_FILE=\"\$KEK_DIR/\$CONTAINER.kek\"',
              'REDIS_URL_HOST_FILE=\"\$KEK_DIR/\$CONTAINER.redis-url\"',
              'install -d -m 0700 -o root -g root \"\$KEK_DIR\"',
              '(umask 077; printf %s \"redis://:\${VALKEY_PASSWORD_ENC}@\${VALKEY_CONTAINER}:6379/\${REDIS_DB}\" > \"\$REDIS_URL_HOST_FILE.tmp\")',
              'unset VALKEY_PASSWORD_ENC',
              'chown 1000:1000 \"\$REDIS_URL_HOST_FILE.tmp\"',
              'chmod 0400 \"\$REDIS_URL_HOST_FILE.tmp\"',
              'mv -f \"\$REDIS_URL_HOST_FILE.tmp\" \"\$REDIS_URL_HOST_FILE\"',
              '(umask 077; aws ssm get-parameter --name \"\$KEK_PARAM\" --with-decryption --query Parameter.Value --output text --region \"\$AWS_REGION\" > \"\$KEK_FILE.tmp\")',
              'test -s \"\$KEK_FILE.tmp\" || { rm -f \"\$KEK_FILE.tmp\"; echo \"ERROR: empty KEK\"; exit 1; }',
              'chown 1000:1000 \"\$KEK_FILE.tmp\"',
              'chmod 0400 \"\$KEK_FILE.tmp\"',
              'mv -f \"\$KEK_FILE.tmp\" \"\$KEK_FILE\"',
              'GW=\$(docker network inspect \"\$DOCKER_NETWORK\" -f \"{{range .IPAM.Config}}{{.Gateway}} {{end}}\" | xargs -n1 | grep -E \"^[0-9]+([.][0-9]+){3}\$\" | head -n 1 || true)',
              'test -n \"\$GW\" || { echo \"ERROR: no IPv4 gateway for the Docker network\"; exit 1; }',
              'SUBNETS=\$(docker network inspect \"\$DOCKER_NETWORK\" -f \"{{range .IPAM.Config}}{{.Subnet}} {{end}}\" 2>/dev/null || true)',
              'test -n \"\$SUBNETS\" || { echo \"ERROR: Docker network \$DOCKER_NETWORK has no user-configured subnet (create it with docker network create --subnet); --ip needs one. The old container keeps running.\"; exit 1; }',
              'python3 -c \"import ipaddress, sys; ip = ipaddress.ip_address(sys.argv[1]); sys.exit(0 if any(ip in ipaddress.ip_network(n, strict=False) for n in sys.argv[2:]) else 1)\" \"\$MCP_CONTAINER_IP\" \$SUBNETS || { echo \"ERROR: MCP_CONTAINER_IP \$MCP_CONTAINER_IP is not an address in the subnet(s) of \$DOCKER_NETWORK: \$SUBNETS. The old container keeps running.\"; exit 1; }',
              'aws ecr get-login-password --region \"\$AWS_REGION\" | docker login --username AWS --password-stdin \"\$ECR_REGISTRY\"',
              'docker pull \"\$IMAGE_URI\"',
              'docker stop -t 30 \"\$CONTAINER\" 2>/dev/null || true',
              'if [ \"\$FLUSH_ONCE\" = true ]; then echo \"FLUSHDB of the MCP database\"; if ! REDISCLI_AUTH=\"\$VALKEY_PASSWORD\" docker exec -e REDISCLI_AUTH \"\$VALKEY_CONTAINER\" valkey-cli -n \"\$REDIS_DB\" FLUSHDB | grep -qx OK; then echo \"ERROR: FLUSHDB failed; restarting the old container\"; docker start \"\$CONTAINER\" || true; exit 1; fi; fi',
              'unset VALKEY_PASSWORD',
              'docker rm \"\$CONTAINER\" 2>/dev/null || true',
              'docker image prune -f 2>/dev/null || true',
              'docker run -d --name \"\$CONTAINER\" --network \"\$DOCKER_NETWORK\" --ip \"\$MCP_CONTAINER_IP\" --restart unless-stopped -p \"127.0.0.1:\${APP_PORT}:3100\" -p \"127.0.0.1:\${METRICS_PORT}:9100\" -e NODE_ENV=production -e \"TRUST_PROXY=loopback,\${GW}\" -e \"RELAY_URL=\${RELAY_URL}\" -e \"PUBLIC_RELAY_URL=\${PUBLIC_RELAY_URL}\" -e \"ALLOWED_HOSTS=\${MCP_HOST}\" -v \"\${KEK_FILE}:/run/secrets/mcp_kek:ro\" -e MCP_KEK_FILE=/run/secrets/mcp_kek -v \"\${REDIS_URL_HOST_FILE}:/run/secrets/redis_url:ro\" -e REDIS_URL_FILE=/run/secrets/redis_url \"\$IMAGE_URI\"',
              'sleep 10',
              'if ! docker ps --filter \"name=\$CONTAINER\" --filter \"status=running\" -q | grep -q .; then echo \"ERROR: Container not running\"; docker logs --tail 50 \"\$CONTAINER\" 2>&1 || true; exit 1; fi',
              'for i in \$(seq 1 10); do if curl -sf \"http://127.0.0.1:\${APP_PORT}/health\" -H \"Host: \${MCP_HOST}\" > /dev/null 2>&1; then echo \"Health check passed (attempt \$i)\"; exit 0; fi; echo \"Attempt \$i failed...\"; sleep 5; done',
              'echo \"ERROR: Health check failed\"; docker logs --tail 50 \"\$CONTAINER\" 2>&1 || true; exit 1'
          ]
          with open('/tmp/ssm-params.json', 'w') as f:
              json.dump({'commands': cmds}, f)
          "

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --timeout-seconds 300 \
            --query 'Command.CommandId' --output text)

          echo "SSM Command ID: $CMD_ID"

          # Poll for completion
          for i in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")

            if [ "$STATUS" = "Success" ]; then
              echo "Deploy succeeded"
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardOutputContent' --output text
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deploy failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "$INSTANCE_ID" \
                --query '[StandardOutputContent,StandardErrorContent]' --output text
              exit 1
            fi
          done
          echo "ERROR: SSM command timed out"
          exit 1
